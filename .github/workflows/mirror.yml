  name: Sync with upstream
  on:
    push:
    schedule:
      - cron: "49 */6 * * *"
    workflow_dispatch:

  jobs:
    sync-mirror:
      runs-on: ubuntu-latest
      permissions:
        contents: write
      steps:
        - name: Update mirror
          uses: projg2/golang-dist-mirror-action@v1
          with:
            token: ${{ secrets.PUSH_TOKEN }}
            upstream-repo: "https://gitlab.torproject.org/tpo/anti-censorship/pluggable-transports/lyrebird"
